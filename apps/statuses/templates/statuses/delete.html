{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Delete status" %}{% endblock %}

{% block content %}
<div class="max-w-md">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">{% trans "Delete status" %}</h1>
    <p class="mb-6">{% trans "Are you sure you want to delete" %} {{ object.name }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-6 rounded-lg">
            {% trans "Yes, delete" %}
        </button>
    </form>
</div>
{% endblock %}
